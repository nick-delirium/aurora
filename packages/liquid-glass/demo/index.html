<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>liquid-glass demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
        overflow: hidden;
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .card {
        --lg-radius: 32px;
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(360px, 84vw);
        padding: 24px;
        translate: -50% -50%;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .card h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      .card p {
        margin: 0;
        opacity: 0.8;
      }
      .pill {
        --lg-radius: 999px;
        position: absolute;
        left: 50%;
        bottom: 32px;
        translate: -50% 0;
        padding: 12px 22px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div class="card lg-glass" id="card">
      <h1>Liquid glass</h1>
      <p>Drag me. The background is an animated 2D canvas; the glass refracts it in WebGL.</p>
    </div>
    <div class="pill lg-glass">createGlassScene()</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
